[package]
name = "tauri-plugin-life-mobile"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-life-mobile"
description = "Private Android Keystore bridge for life-timeline"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[dependencies]
tauri = { version = "2.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
